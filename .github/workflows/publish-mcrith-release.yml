name: Publish MCRith Release

on:
  workflow_run:
    workflows: ["MCRith Build"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts
          merge-multiple: false

      - name: Prepare release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          found=0
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -qr "../../release-assets/${name}.zip" .)
            found=1
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::No platform artifacts were downloaded."
            exit 1
          fi
          ls -lh release-assets

      - name: Publish one release with every platform
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mcrith-${{ github.event.workflow_run.head_sha }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: MCRith ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true
          files: release-assets/*.zip
